name: Scrape seminars
on:
  workflow_dispatch:
    inputs:
      strict_harvest:
        description: strict_harvest
        required: false
        default: "false"
  schedule:
    - cron: "47 8 * * 1"
concurrency:
  group: polymythcal-publish-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      STRICT_HARVEST_FAILURES: ${{ github.event.inputs.strict_harvest || 'false' }}
      HARVEST_ATTEMPTS: "1"
      HARVEST_TIMEOUT_SECONDS: "1500"
      HARVEST_STRICT: ${{ github.event.inputs.strict_harvest || 'false' }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-harvest.txt
      - name: Install calendar dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-harvest.txt
      - name: Restore retained parsed-response cache
        uses: actions/cache/restore@v5
        with:
          path: data/polymythcal-http-cache.json
          key: polymythcal-parsed-http-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            polymythcal-parsed-http-v1-${{ runner.os }}-
      - name: Run deterministic priority structured discovery
        run: python3 scripts/harvest_structured_events.py --output /tmp/polymythcal-structured.json --max-pages 8 --max-elapsed-seconds 45 --max-workers 8
      - name: Detect mature per-source deterministic anomalies
        run: python3 scripts/check-polymythcal-source-anomalies.py --stream seminars-deterministic --current /tmp/polymythcal-structured.json --history data/harvest-source-history.json --report /tmp/seminars-deterministic-source-anomalies.json --strict --write-history
      - name: Build deterministic harvest coverage report
        if: always()
        run: python3 scripts/build-polymythcal-harvest-coverage-report.py --run-date "$(date -u +%F)" --structured-run /tmp/polymythcal-structured.json --output /tmp/polymythcal-harvest-coverage.json
      - name: Preserve structured source-health diagnostics
        if: failure()
        run: |
          mkdir -p data/harvest-runs
          if [ -f /tmp/polymythcal-structured.json ]; then
            cp /tmp/polymythcal-structured.json data/harvest-runs/seminars-deterministic-failed.json
          fi
      - name: Publish deterministic harvest before optional agent
        run: |
          python3 scripts/publish_deterministic_polymythcal.py --structured-only
          python3 scripts/validate-polymythcal.py
      - name: Install Claude Code CLI
        id: install_claude
        continue-on-error: true
        timeout-minutes: 5
        run: npm install -g @anthropic-ai/claude-code@2.1.14
      - name: Claude version
        id: claude_version
        if: steps.install_claude.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        run: claude --version
      - name: Run seminar harvest
        if: steps.install_claude.outcome == 'success' && steps.claude_version.outcome == 'success'
        run: bash scripts/seminars-prompt-runner.sh
      - name: Summarize harvest outcome
        id: harvest_summary
        if: always()
        run: node scripts/summarize-harvest-status.js seminars
      - name: Verify generated calendar
        run: |
          python3 scripts/validate-polymythcal.py
          npm run verify:calendar-data
      - name: Create publication pull request
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/polymythcal-seminars
          delete-branch: true
          commit-message: "Update Polymythcal verified data"
          title: "Polymythcal verified harvest update"
          body: "Automated harvest passed canonical semantic validation. Review the event diff, qualifications, lifecycle changes, and source diagnostics before merging."
          labels: polymythcal,automated-harvest
      - name: Preserve harvest diagnostics
        if: failure() || steps.harvest_summary.outputs.degraded == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: seminar-harvest-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            /tmp/polymythcal-structured.json
            /tmp/polymythcal-harvest-coverage.json
            /tmp/seminars-deterministic-source-anomalies.json
            data/harvest-runs/**
            data/polymythcal-lifecycle-log.json
            data/polymythcal-lifecycle-state.json
      - name: Summarize harvest diagnostics
        if: always()
        run: bash scripts/summarize-harvest-diagnostics.sh seminars
      - name: Save retained parsed-response cache
        if: always() && hashFiles('data/polymythcal-http-cache.json') != ''
        uses: actions/cache/save@v5
        with:
          path: data/polymythcal-http-cache.json
          key: polymythcal-parsed-http-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
