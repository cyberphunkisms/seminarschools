name: Pre-deploy verification
on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: predeploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clean-build:
    name: Clean build (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        # Ubuntu receives the complete clean build in full-audit below. Keep
        # this matrix for the two additional operating-system contracts.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-audit.lock
      - name: Install calendar test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement requirements-audit.lock
      - name: Test adapters and lifecycle on this operating system
        run: |
          npm run test:polymythcal-adapters
          npm run test:polymythcal-harvest
          npm run test:polymythcal-lifecycle
          npm run test:polymythcal-sharding
          npm run test:polymythcal-audit43
          npm run test:polymythcal-audit47
          npm run test:polymythcal-deterministic-before-agent
          npm run test:polymythcal-occurrence-merge
          npm run test:polymythcal-festival-merge
          npm run test:festival-pipeline
      - name: Build exactly as Netlify builds
        run: npm run build
      - name: Verify Audit 48 calendar clients on this operating system
        run: npm run verify:audit48-calendar-clients
      - name: Verify frozen history and Audit 45 translations
        env:
          PYTHON_BIN: python
        run: |
          npm run verify:frozen-audit43
          npm run verify:audit45-translations
      - name: Verify release automation contract
        run: npm run verify:predeploy-automation

  tracked-public-regression:
    name: Build survives legacy tracked public state
    needs: clean-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-audit.lock
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement requirements-audit.lock
      - name: Generate public once
        run: npm run build:public-deploy
      - name: Reproduce legacy repository state
        shell: bash
        run: |
          sed -i -E '/^\/?public\/$/d' .gitignore
          git add -f public
          test -n "$(git ls-files public)"
      - name: Prove production build remains deployable
        run: npm run build
  full-audit:
    needs: clean-build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-audit.lock
      - name: Install locked JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify production function dependency resolution
        run: npm run verify:function-dependencies
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement requirements-audit.lock
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Full repository verifier
        run: npm run verify:repository:built
      - name: Verify current Audit 48 live-harvest evidence
        run: npm run verify:audit48-live-harvest:current
      - name: Audit 45 translation browser matrix
        run: npm run audit:audit45-browser
      - name: Verify fresh Audit 45 browser evidence
        run: npm run verify:audit45-current-browser-evidence
      - name: Upload Audit 45 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit45-predeploy-translation-evidence
          retention-days: 14
          path: |
            data/audit43-frozen-sha256.json
            data/audit42-frozen-sha256.json
            data/audit45-translation-governance.json
            data/audit45-browser/**
            WEBSITE_AUDIT44_FULL_TRANSLATION_REPORT_2026-07-25.md
            WEBSITE_AUDIT45_FULL_TRANSLATION_IMPLEMENTATION_REPORT_2026-07-25.md
            WEBSITE_AUDIT48_CALENDAR_CLIENT_INTEROPERABILITY_REPORT_2026-07-26.md
            WEBSITE_AUDIT48_EXTERNAL_VALIDATION_INTEROPERABILITY_REPORT_2026-07-26.md
            WEBSITE_AUDIT49_TECHNICAL_EFFICIENCY_RESILIENCE_REPORT_2026-07-26.md
            AUDIT48_NATIVE_DEVICE_AT_TEST_PROTOCOL_2026-07-26.md
            AUDIT48_CALENDAR_VENDOR_IMPORT_PROTOCOL_2026-07-26.md
            .github/ISSUE_TEMPLATE/polymythcal-native-at-signoff.yml
            data/audit48-browser/**
            scripts/reports/audit48-*.json
            scripts/reports/audit49-*.json
            scripts/reports/release-gate-report.json
          if-no-files-found: warn
