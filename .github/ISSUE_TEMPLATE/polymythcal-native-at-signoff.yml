name: Polymythcal native accessibility sign-off
description: Record one Audit 48 native browser, screen-reader, physical-device, or real-user matrix row.
title: "[Audit 48 native sign-off] "
labels:
  - accessibility
body:
  - type: dropdown
    id: matrix
    attributes:
      label: Matrix row
      options:
        - macOS Safari with VoiceOver
        - Windows Firefox with NVDA
        - Windows Chrome with NVDA
        - iPhone Safari with VoiceOver
        - Android Chrome with TalkBack
        - Real-user task session
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release ID
      value: 2026-07-26-site-audit48-external-validation-interoperability-final
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Device, operating system, browser, and assistive-technology versions
    validations:
      required: true
  - type: textarea
    id: routes
    attributes:
      label: Routes and tasks completed
      description: Follow AUDIT48_NATIVE_DEVICE_AT_TEST_PROTOCOL_2026-07-26.md.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Passes, failures, and blocked checks
      description: Include exact spoken output or control state needed to explain a failure. Do not include sensitive form content.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Consent-safe evidence locations
  - type: checkboxes
    id: signoff
    attributes:
      label: Sign-off
      options:
        - label: Every release-blocking failure has a passing retest.
          required: true
        - label: Any recording or identifying information was collected with consent.
          required: true
