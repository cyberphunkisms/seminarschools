<!doctype html><html lang="en"><meta charset="utf-8"><title>Site audit viewport</title><style>body{margin:12px;background:#ddd;font:14px system-ui}iframe{display:block;border:1px solid #888;margin-top:12px;width:390px;height:844px}input{width:500px}button{margin:4px}</style><label>Route <input id="route" value="/polymythseminars/"></label><button id="load">Load page</button><button id="phone">Phone layout</button><button id="desktop">Desktop layout</button><button id="top">Top</button><button id="middle">Middle</button><button id="bottom">Bottom</button><button id="geometry">Toggle geometry</button><output id="auditReady">Loading</output><iframe title="Website audit viewport" src="/polymythseminars/"></iframe><script>
const frame=document.querySelector('iframe');const ready=document.querySelector('#auditReady');frame.onload=()=>{setTimeout(()=>{ready.textContent=frame.contentWindow.location.pathname+' ready'},650)};for(const [id,portion] of [['top',0],['middle',0.5],['bottom',1]])document.querySelector('#'+id).onclick=()=>{const root=frame.contentDocument.scrollingElement;ready.textContent='Moving';root.scrollTop=(root.scrollHeight-root.clientHeight)*portion;setTimeout(()=>{ready.textContent=id+' settled'},650)};document.querySelector('#load').onclick=()=>{const url=new URL(document.querySelector('#route').value,location.origin);if(url.origin===location.origin){ready.textContent='Loading';frame.src=url.pathname+url.search+url.hash}};document.querySelector('#phone').onclick=()=>{frame.style.width='390px';frame.style.height='844px'};document.querySelector('#desktop').onclick=()=>{frame.style.width='1280px';frame.style.height='900px'};document.querySelector('#geometry').onclick=()=>{const layer=frame.contentDocument.querySelector('#indraLayer');if(layer)layer.style.visibility=layer.style.visibility==='hidden'?'visible':'hidden'};
</script></html>
